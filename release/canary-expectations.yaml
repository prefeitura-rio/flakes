      - lint:typescript:strlint
      - lint:typescript:typecheck
    expected_skipped:
      - quality-gate:tests
  - id: 78
    name: multi-repo-battlegrounds
    ref: main
    expected_findings:
      - format:python:ruff
      - format:go:gofumpt
      - format:go:goimports
