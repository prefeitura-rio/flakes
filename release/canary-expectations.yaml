version: 1
required_jobs:
  - quality-gate:detect
  - quality-gate:format
  - quality-gate:lint
  - quality-gate:strlint
  - quality-gate:typecheck
  - quality-gate:tests
projects:
  - id: 48
    name: python-battlegrounds
    ref: main
    expected_findings:
      - format:python:ruff
      - lint:python:ruff
      - lint:python:complexipy
      - lint:python:basedpyright
    required_checks:
      - format:python:ruff
      - lint:python:ruff
      - lint:python:complexipy
      - lint:python:basedpyright
      - lint:python:strlint
    expected_skipped:
      - quality-gate:tests
