name: Quality Gate Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "devenv/**"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/**"
      - "tests/**"
      - "release/**"
      - ".github/**"
  push:
    branches: [master]
    paths:
      - "devenv/**"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/**"
      - "tests/**"
      - "release/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: quality-gate-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Quality Gate / self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Use devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Validate the flake app
        run: nix build .#quality-gate --no-link
      - name: Run internal package tests
        run: devenv tasks run pkgs:test
      - name: Checkout release toolkit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          repository: prefeitura-rio/actions
          ref: 13dc55b38fd546b1a2805ba72374efc2cf5c38ba
          path: release-toolkit
      - name: Run release script tests
        run: |
          bash release-toolkit/release/tests/test-version.sh
          bash release-toolkit/release/tests/test-publish-tags.sh
