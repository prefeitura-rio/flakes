name: Quality Gate Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "devenv/**"
      - "devenv.nix"
      - "devenv.yaml"
      - "devenv.lock"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/**"
      - "tests/**"
      - "release/**"
      - ".github/**"
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quality-gate-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Quality Gate / self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Use devenv binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Validate the flake app
        run: |
          nix build \
            .#quality-gate \
            .#quality-gate-python \
            .#quality-gate-go \
            .#quality-gate-typescript \
            --no-link
      - name: Run Quality Gate self-test
        run: devenv tasks run quality-gate:self-test
      - name: Run Quality Gate package tests
        run: |
          devenv tasks run complexipy:test
          devenv tasks run react-doctor:test
