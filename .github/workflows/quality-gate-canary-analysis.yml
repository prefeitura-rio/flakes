name: Quality Gate Canary Analysis

on:
  workflow_run:
    workflows: ["Quality Gate Release"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "quality-gate-next or an immutable Quality Gate SHA"
        required: false
        type: string
      create_promotion_pr:
        description: "Open a promotion PR when the analysis and bake are healthy"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: quality-gate-canary-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Analyze Quality Gate canary
    runs-on: ubuntu-latest
    env:
      GITLAB_API: https://git.iplan.rio/api/v4
      GITLAB_TOKEN: ${{ secrets.GITLAB_CANARY_TOKEN }}
      CANDIDATE_REF_INPUT: ${{ inputs.candidate_ref }}
      HAS_RELEASE_APP: ${{ secrets.QUALITY_GATE_RELEASE_APP_ID != '' && secrets.QUALITY_GATE_RELEASE_APP_PRIVATE_KEY != '' }}
      CREATE_PROMOTION_PR: ${{ (github.event_name != 'workflow_dispatch' || inputs.create_promotion_pr) && secrets.QUALITY_GATE_RELEASE_APP_ID != '' && secrets.QUALITY_GATE_RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Use Quality Gate binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: prefeitura-rio
          extraPullNames: devenv
          skipPush: true
      - name: Create release App token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        id: release-token
        with:
          app-id: ${{ secrets.QUALITY_GATE_RELEASE_APP_ID }}
          private-key: ${{ secrets.QUALITY_GATE_RELEASE_APP_PRIVATE_KEY }}
          owner: prefeitura-rio
          repositories: flakes
      - name: Trigger and analyze sandbox pipelines
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
        run: |
          set -euo pipefail

          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_CANARY_TOKEN is required." >&2
            exit 1
          fi

          candidate_ref="${CANDIDATE_REF_INPUT:-quality-gate-next}"
          if [[ "$candidate_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            candidate_sha="$candidate_ref"
          else
            candidate_sha="$(git ls-remote \
              https://github.com/prefeitura-rio/flakes.git \
              "refs/tags/${candidate_ref}^{}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -z "$candidate_sha" ]; then
            echo "Could not resolve candidate ref $candidate_ref." >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          artifact_name="quality-gate-canary-${candidate_sha}"
          echo "CANARY_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          previous_artifact_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id' | head -n 1 || true)"
          if [ -n "$previous_artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${previous_artifact_id}/zip" > "$tmp/previous.zip"
            if unzip -p "$tmp/previous.zip" canary-analysis.json | jq -e '.healthy == true' >/dev/null; then
              echo "Candidate ${candidate_sha} already has a healthy canary analysis."
              exit 0
            fi
          fi
          pipelines="$tmp/pipelines.tsv"
          cat > "$tmp/projects.tsv" <<'EOF'
          48|python-battlegrounds
          49|go-battlegrounds
          50|typescript-battlegrounds
          51|vue-battlegrounds
          78|multi-repo-battlegrounds
          EOF

          while IFS='|' read -r project_id project_name; do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --form ref=main \
              --form "variables[PREFRIO_REF]=$candidate_sha" \
              --form "variables[QUALITY_GATE_CANARY]=true" \
              "$GITLAB_API/projects/$project_id/pipeline")"
            pipeline_id="$(jq -r .id <<<"$response")"
            printf '%s|%s|%s\n' "$project_id" "$project_name" "$pipeline_id" >> "$pipelines"
          done < "$tmp/projects.tsv"

          timeout_minutes=45
          deadline=$((SECONDS + timeout_minutes * 60))
          while true; do
            all_done=true
            while IFS='|' read -r project_id project_name pipeline_id; do
              status="$(curl --fail-with-body --silent --show-error \
                --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                "$GITLAB_API/projects/$project_id/pipelines/$pipeline_id" | jq -r .status)"
              case "$status" in
                created|pending|running|preparing|waiting_for_resource)
                  all_done=false
                  ;;
              esac
              printf '%s: %s\n' "$project_name" "$status"
            done < "$pipelines"
            if [ "$all_done" = true ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Canary pipeline timeout after ${timeout_minutes} minutes." >&2
              exit 1
            fi
            sleep 15
          done

          results="$tmp/results.json"
          printf '[]\n' > "$results"
          while IFS='|' read -r project_id project_name pipeline_id; do
            jobs_file="$tmp/jobs-$project_id.json"
            printf '[]\n' > "$jobs_file"
            jobs="$(curl --fail-with-body --silent --show-error \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              "$GITLAB_API/projects/$project_id/pipelines/$pipeline_id/jobs?per_page=100")"
            while read -r job_id job_name job_status; do
              trace="$(curl --fail-with-body --silent --show-error \
                --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                "$GITLAB_API/projects/$project_id/jobs/$job_id/trace" || true)"
              junit=""
              if [[ "$job_name" =~ ^quality-gate:(format|lint|strlint|typecheck|tests)$ ]]; then
                artifact="$tmp/artifact-${job_id}.zip"
                if curl --fail-with-body --silent --show-error \
                  --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                  "$GITLAB_API/projects/$project_id/jobs/$job_id/artifacts" \
                  --output "$artifact"; then
                  member="$(unzip -Z1 "$artifact" | grep -E 'quality-gate-(format|lint|strlint|test)\.xml$' | head -n 1 || true)"
                  if [ -n "$member" ]; then
                    junit="$(unzip -p "$artifact" "$member")"
                  fi
                fi
              fi
              jq --arg name "$job_name" \
                --arg status "$job_status" \
                --arg trace "$trace" \
                --arg junit "$junit" \
                '. += [{name: $name, status: $status, trace: $trace, junit: $junit}]' \
                "$jobs_file" > "$jobs_file.tmp"
              mv "$jobs_file.tmp" "$jobs_file"
            done < <(jq -r '.[] | [.id, .name, .status] | @tsv' <<<"$jobs")

            analysis="$(nix --extra-experimental-features 'nix-command flakes' run --inputs-from . nixpkgs#nushell -- \
              release/canary-analysis.nu evaluate release/canary-expectations.yaml "$project_id" "$jobs_file")"
            jq --arg id "$project_id" --arg name "$project_name" \
              --argjson analysis "$analysis" \
              '. += [{project_id: ($id | tonumber), project: $name, analysis: $analysis}]' \
              "$results" > "$results.tmp"
            mv "$results.tmp" "$results"
          done < "$pipelines"

          jq --arg candidate_ref "$candidate_ref" --arg candidate_sha "$candidate_sha" \
            '{candidate_ref: $candidate_ref, candidate_sha: $candidate_sha, projects: ., healthy: ([.[].analysis.healthy] | all)}' \
            "$results" | tee canary-analysis.json

          {
            echo "## Quality Gate Canary Analysis"
            echo
            echo "- Candidate: \`$candidate_ref\`"
            echo "- SHA: \`$candidate_sha\`"
            jq -r '.projects[] | "- \(.project): healthy=\(.analysis.healthy), engine_failures=\(.analysis.engine_failures | length), unexpected_findings=\(.analysis.unexpected_findings | length)"' canary-analysis.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(jq '[.projects[].analysis.healthy] | all' canary-analysis.json)" != true ]; then
            echo "Canary analysis is unhealthy." >&2
            exit 1
          fi

          git fetch --tags origin
          version_tag="$(git tag --points-at "$candidate_sha" 'quality-gate-v*' | sort -V | tail -n 1)"
          if [ -z "$version_tag" ]; then
            echo "Healthy canary has no immutable version tag yet; promotion PR will wait."
            exit 0
          fi

          test "$(git cat-file -t "refs/tags/$version_tag")" = tag
          candidate_created="$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/$version_tag")"
          current_sha="$(git rev-parse --verify 'refs/tags/quality-gate-latest^{commit}' 2>/dev/null || true)"
          current=""
          if [ -n "$current_sha" ]; then
            current="$(git tag --points-at "$current_sha" 'quality-gate-v*' | head -n 1)"
          fi
          now="$(date --iso-8601=seconds --utc)"
          decision="$(nix --extra-experimental-features 'nix-command flakes' run --inputs-from . nixpkgs#nushell -- \
            release/promote.nu validate "$version_tag" "$current" "$candidate_created" "$now" 3 | jq -r .decision)"
          if [ "$decision" != promote ] || [ "$CREATE_PROMOTION_PR" != true ]; then
            echo "Canary is healthy but is not ready for automatic promotion."
            exit 0
          fi

          branch="automation/quality-gate-promotion-${version_tag}"
          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Promotion PR #${existing_pr} already exists for ${version_tag}."
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch --create "$branch"
          previous="$(awk -F': *' '$1 == "latest" { print $2 }' release/channels.yaml | tr -d '"')"
          sed -i -E "s/^latest:.*$/latest: \"$version_tag\"/" release/channels.yaml
          if grep -q '^previous:' release/channels.yaml; then
            sed -i -E "s/^previous:.*$/previous: \"${previous}\"/" release/channels.yaml
          else
            sed -i "/^latest:/a previous: \"${previous}\"" release/channels.yaml
          fi
          git add release/channels.yaml
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: promote Quality Gate ${version_tag}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore: promote Quality Gate ${version_tag}" \
            --body "Automated canary analysis passed for \`${version_tag}\` after the three-day bake period. See the workflow artifact for per-sandbox findings and engine classification."
      - name: Upload canary analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.CANARY_ARTIFACT_NAME }}
          path: canary-analysis.json
          if-no-files-found: ignore
