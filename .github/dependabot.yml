version: 2
updates:
  # Every action is pinned to a full commit SHA. Dependabot keeps the pin and
  # the version comment in step, and each update still goes through a pull
  # request that the code owners review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
